[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-assistant"
version = "0.1.0"
description = "Meridian Finance Analyst Assistant — deterministic finance analysis system"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "streamlit>=1.36",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "litellm>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["finance_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
